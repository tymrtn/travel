[package]
name = "envelope-email-dashboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Localhost email client dashboard — inbox, read, compose, reply, drafts, snooze, threads"

[dependencies]
envelope-email-store = { path = "../store" }
envelope-email-transport = { path = "../email" }

axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
mail-parser.workspace = true
rusqlite.workspace = true
url.workspace = true
tempfile = "3"
web-push = { version = "0.11", default-features = false }

rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
regex = "1"

[dev-dependencies]
tower = "0.5"
